version: '3.8'

services:
  pg-catalog:
    image: postgres:15-alpine
    container_name: pg_catalog
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER={POSTGRES_USER}
      - POSTGRES_PASSWORD={POSTGRES_PASSWORD}
      - POSTGRES_DB={POSTGRES_DB}
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "kxuiceberg" ]
      interval: 5s
      retries: 5
    ports:
      - "5432:5432"


  spark-iceberg:
    build:
      context: ./spark
      #args:  //not used anymore, we monunt file directly
      #  SPARK_DEFAULTS_CONF: spark-defaults-pg-catalog.conf
    volumes:
      - ./spark/spark-defaults-pg-catalog.conf:/opt/spark/conf/spark-defaults.conf #mount default config file       
    depends_on:
      - pg-catalog
  
  spark-worker:
    volumes:
      - ./spark/spark-defaults-pg-catalog.conf:/opt/spark/conf/spark-defaults.conf #mount default config file       

  spark-history-server:
    volumes:
      - ./spark/spark-defaults-pg-catalog.conf:/opt/spark/conf/spark-defaults.conf #mount default config file   
