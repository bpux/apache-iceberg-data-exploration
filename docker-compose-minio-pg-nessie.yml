
services:
  nessie:
    image: ghcr.io/projectnessie/nessie:0.103.0-java
    platform: linux/amd64
    container_name: nessie  
    environment:
      # This example uses Postgres as the version store.
      - nessie.version.store.type=JDBC
      - nessie.version.store.persist.jdbc.datasource=postgresql
      - quarkus.datasource.postgresql.jdbc.url=jdbc:postgresql://pg-catalog:5432/kxuiceberg
      - quarkus.datasource.postgresql.username=kxuiceberg
      - quarkus.datasource.postgresql.password=kxuiceberg
      # Object store settings.
      # This example uses MinIO as the object store.
      - nessie.server.authentication.enabled=false
      - nessie.catalog.default-warehouse=kxu-iceberg-data
      - nessie.catalog.warehouses.kxu-iceberg-data.location=s3://kxu-iceberg-data
      - nessie.catalog.service.s3.default-options.region=us-east-1
      - nessie.catalog.service.s3.default-options.path-style-access=true
      - nessie.catalog.service.s3.default-options.access-key=urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
      - nessie.catalog.secrets.access-key.name=user
      - nessie.catalog.secrets.access-key.secret=password
      - nessie.catalog.service.s3.default-options.endpoint=http://minio-s3:9000/
      - nessie.catalog.service.s3.default-options.external-endpoint=http://127.0.0.1:9001/
    networks:
      iceberg-net:
    ports:
      - 19120:19120
    depends_on:
      - pg-catalog
    healthcheck:
      test: "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /q/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"
      interval: 5s
      timeout: 2s
      retries: 15      

  spark-iceberg:
    volumes:
      - ./spark/spark-defaults-minio-nessie-catalog.conf:/opt/spark/conf/spark-defaults.conf #mount default config file   
    networks:
      iceberg-net:
    depends_on:
      - minio-s3-init

  spark-worker:
    volumes:
      - ./spark/spark-defaults-minio-nessie-catalog.conf:/opt/spark/conf/spark-defaults.conf #mount default config file   
    networks:
      iceberg-net:

  spark-history-server:
    volumes:
      - ./spark/spark-defaults-minio-nessie-catalog.conf:/opt/spark/conf/spark-defaults.conf #mount default config file   
    networks:
      iceberg-net:

#volumes:
#  minio-s3-data:

networks:
  iceberg-net:
