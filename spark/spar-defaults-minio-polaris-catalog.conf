spark.master                           spark://spark-iceberg:7077
spark.eventLog.enabled                 true
spark.eventLog.dir                     /opt/spark/spark-events
spark.history.fs.logDirectory          /opt/spark/spark-events
spark.sql.extensions                   org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Main data catalog configuration
spark.sql.catalog.data                 org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.data.warehouse       s3://kxu-iceberg-data/bronze_data
spark.sql.catalog.data.s3.endpoint     http://minio-s3:9000
spark.sql.catalog.data.io-impl         org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.data.catalog-impl    org.apache.iceberg.polaris.PolarisCatalog
spark.sql.catalog.data.uri             thrift://polaris-server:9083
spark.sql.catalog.data.client.id       your-client-id
spark.sql.catalog.data.client.secret   your-client-secret

# CDC catalog configuration
spark.sql.catalog.iceberg                 org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.warehouse       s3://kxu-iceberg-data/cdc-bronze-data
spark.sql.catalog.iceberg.s3.endpoint     http://minio-s3:9000
spark.sql.catalog.iceberg.io-impl         org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg.catalog-impl    org.apache.iceberg.polaris.PolarisCatalog
spark.sql.catalog.iceberg.uri            thrift://polaris-server:9083
spark.sql.catalog.iceberg.client.id       your-client-id
spark.sql.catalog.iceberg.client.secret   your-client-secret

# Local catalog configuration (unchanged)
spark.sql.catalog.kxudata                 org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.kxudata.type            hadoop
spark.sql.catalog.kxudata.warehouse       /home/iceberg/warehouse

# Default catalog settings
spark.sql.defaultCatalog               data
spark.sql.catalogImplementation        in-memory