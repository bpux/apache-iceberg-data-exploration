spark.master                           spark://spark-iceberg:7077
spark.eventLog.enabled                 true
spark.eventLog.dir                     /opt/spark/spark-events
spark.history.fs.logDirectory          /opt/spark/spark-events
spark.sql.extensions                   org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

spark.sql.catalog.data                 org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.data.type            hadoop
spark.sql.catalog.data.warehouse       s3a://kxu-iceberg-data/bronze_data
spark.sql.catalog.data.s3.endpoint	   http://minio-s3:9000
spark.sql.catalog.data.io-impl		   org.apache.iceberg.aws.s3.S3FileIO

spark.sql.catalog.data2                 org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.data2.type            hadoop
spark.sql.catalog.data2.warehouse       s3a://kxu-iceberg-data/silver_data
spark.sql.catalog.data2.s3.endpoint	    http://minio-s3:9000
spark.sql.catalog.data2.io-impl		    org.apache.iceberg.aws.s3.S3FileIO


spark.hadoop.fs.s3a.access.key                user
spark.hadoop.fs.s3a.secret.key                password
spark.hadoop.fs.s3a.impl                      org.apache.hadoop.fs.s3a.S3AFileSystem

spark.sql.defaultCatalog               data
spark.sql.catalogImplementation        in-memory
